name: Feature request
description: Suggest something to improve FwKnop-ng
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why is it not possible or inconvenient today?
      placeholder: |
        Example:
          "My fwknopd server requires … and the app does not support it."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Suggest only one feature per issue. If it mirrors an option of the `fwknop` command-line client or of `fwknopd`, name it.
      placeholder: |
        Example:
          "Support the `--server-cmd` option of the fwknop client…"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Alternatives considered, links, screenshots…

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched the [existing issues](https://github.com/gildas-le-drogoff/FwKnop-ng/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I have updated the app to the **[latest version](https://github.com/gildas-le-drogoff/FwKnop-ng/releases)**.
          required: true
        - label: I wrote my request in English or French.
          required: true
