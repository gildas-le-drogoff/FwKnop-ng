name: Lock threads

on:
  # Weekly
  schedule:
    - cron: '0 0 * * 0'
  # Manual trigger
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ github.token }}
          # Closed threads only: new reports go to a fresh issue instead of necro-bumping.
          issue-inactive-days: '30'
          pr-inactive-days: '30'
          process-only: 'issues, prs'
