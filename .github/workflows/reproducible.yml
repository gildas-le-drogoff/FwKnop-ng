name: Reproducible build

# verify: builds the release APK twice, from two independent checkouts in
# different paths, and fails if the results are not byte-for-byte identical.
#
# verify-release: once the Release workflow has published a tag, rebuilds that
# tag unsigned and checks it against the signed FwKnop-ng-<version>.apk of the
# GitHub release with apksigcopier, the tool F-Droid uses: the published APK,
# signature aside, must be the APK built from source. This is exactly the check
# F-Droid runs before publishing (Binaries: in its metadata). Run it by hand on
# an existing release with workflow_dispatch and the tag as input.
#
# Without keystore.properties the checkouts build unsigned APKs (no debug-key
# fallback), so no state outside the checkout influences the signature. No
# NDK/CMake: inference is pure Kotlin; the bundled .so files (via AndroidX) are
# kept unstripped (jniLibs.keepDebugSymbols) so their bytes do not depend on an
# installed NDK.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check against its published APK (e.g. v2.1.2); empty to skip'
        required: false
        default: ''
  push:
    tags: ['v*']
  # A release created by release.yml with GITHUB_TOKEN does not fire "release"
  # events, hence workflow_run.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (copy A)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: a

      - name: Checkout (copy B)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: b

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: a/.github/.java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default is "tools platform-tools"; Google removed the
          # obsolete "tools" package from the SDK repository, so the default makes
          # sdkmanager exit 1. No NDK/CMake needed: inference is pure Kotlin.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: disabled  # avoids classpath artifacts
          cache-read-only: true  # tag runs reuse main's cache without churning it

      - name: Build A
        run: ./a/gradlew -p a clean :app:assembleRelease --stacktrace

      - name: Check A is unsigned
        run: ./a/tools/check-apk-unsigned.sh a/app/build/outputs/apk/release/app-release*.apk

      - name: Build B
        run: ./b/gradlew -p b clean :app:assembleRelease --stacktrace

      - name: Check B is unsigned
        run: ./a/tools/check-apk-unsigned.sh b/app/build/outputs/apk/release/app-release*.apk

      - name: Compare (must be byte-identical)
        run: |
          A="$(echo a/app/build/outputs/apk/release/app-release*.apk)"
          B="$(echo b/app/build/outputs/apk/release/app-release*.apk)"
          sha256sum "$A" "$B"
          if cmp -s "$A" "$B"; then
            echo "✅ Reproducible: the two builds are byte-for-byte identical."
          else
            echo "::error::Build is not reproducible — the two APKs differ."
            cmp "$A" "$B" || true
            exit 1
          fi

  verify-release:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    env:
      # For a tag push, workflow_run.head_branch is the tag name.
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: '$TAG'."
            exit 1
          fi

      # A real clone (.git directory), as F-Droid does: AGP records the commit in
      # META-INF/version-control-info.textproto.
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .github/.java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # See the verify job.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: disabled  # avoids classpath artifacts
          cache-read-only: true

      - name: Build unsigned release APK
        run: ./gradlew clean :app:assembleRelease --stacktrace

      - name: Check it is unsigned
        run: ./tools/check-apk-unsigned.sh app/build/outputs/apk/release/app-release*.apk

      - name: Download the published APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern "FwKnop-ng-${TAG#v}.apk" --pattern SHA256SUMS
          (cd published && sha256sum -c SHA256SUMS)

      - name: Install apksigcopier
        run: |
          pipx install apksigcopier==1.1.1
          # apksigcopier verifies the copied signature with apksigner.
          APKSIGNER="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          dirname "$APKSIGNER" >> "$GITHUB_PATH"

      - name: Compare (published APK minus signature must equal the build)
        run: |
          P="published/FwKnop-ng-${TAG#v}.apk"
          U="$(echo app/build/outputs/apk/release/app-release*.apk)"
          if apksigcopier compare "$P" --unsigned "$U"; then
            echo "✅ $TAG: the published APK is the APK built from source (signature aside)."
          else
            echo "::error::$TAG: the published APK differs from the build from source; F-Droid will reject it."
            echo "Entries that differ (CRC-32, name):"
            diff <(unzip -lv "$P" | awk '{ print $7, $8 }') <(unzip -lv "$U" | awk '{ print $7, $8 }') || true
            exit 1
          fi
