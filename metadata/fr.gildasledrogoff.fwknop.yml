MaintainerNotes: |-
  Summary, description, title, icon, screenshots and changelogs (en-US, fr-FR)
  are maintained upstream in fastlane/metadata/android.

  keystore.properties is removed: it only holds the upstream release signing
  configuration, the build falls back to an unsigned release otherwise.

  The project uses Gradle 9.x, which the packaged gradlew-fdroid may not know yet.

  Network: besides the SPA packet sent to the user-chosen fwknopd server, the
  public IP may be resolved through STUN (stun.cloudflare.com, stun.l.google.com) and an HTTPS lookup URL (default https://ifconfig.me/ip,
  user configurable).

